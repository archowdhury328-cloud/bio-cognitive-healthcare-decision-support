[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "biocog"
version = "0.1.0"
description = "Research reference implementation: multimodal, uncertainty-aware early-warning for ICU glucose excursions, with baselines, federated and alert-routing simulations."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26,<3",
    "pandas>=2.1",
    "scikit-learn>=1.4",
    "torch>=2.2",
    "matplotlib>=3.8",
    "pyyaml>=6",
    "joblib>=1.3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.5"]

[project.scripts]
biocog = "biocog.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["slow: trains neural models (a few minutes)"]
addopts = "-q"

[tool.coverage.run]
source = ["src/biocog"]
omit = ["src/biocog/__main__.py"]

[tool.ruff]
line-length = 132
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E741", "B905"]
