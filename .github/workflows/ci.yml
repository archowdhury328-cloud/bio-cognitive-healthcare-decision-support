name: ci
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history for the secret scan
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install (CPU torch, no clinical credentials needed)
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests scripts
      - name: Fixture checksums
        run: python -m biocog verify-data --which fixture
      - name: Tests with coverage (fail under 80%)
        run: pytest --cov=biocog --cov-report=term-missing --cov-fail-under=80
      - name: Clean-checkout end-to-end demo
        run: python -m biocog demo --out demo_output
      - name: No tracked patient records or secrets
        run: python scripts/scan_repo.py

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
